name: Nightly SQL suites

on:
  schedule:
    # 21:00 UTC = 05:00 AWST — after the app's own nightly ops run.
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  sql-suites:
    name: SQL suites against the hosted database
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    # The suites gate signing, immutability and RLS — the checks nothing in
    # the default test path touches. Skips cleanly if the secret is absent.
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Run every suite
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          set -e
          for f in supabase/tests/0*.sql; do
            out=$(supabase db query --project-ref upnkkqqwstwtmfqmmbjh -f "$f" 2>&1) || { echo "FAIL $f"; echo "$out" | tail -5; exit 1; }
            if echo "$out" | grep -qiE '"_tag":"Error"|exception'; then
              echo "FAIL $f"; echo "$out" | grep -i message | head -3; exit 1
            fi
            echo "PASS $(basename "$f")"
          done
